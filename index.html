<!doctype html>

<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Koren Olam | קורן עולם</title>
<meta name="description" content="קורן עולם – ולוגים של טיולים, תרבויות ואתגרים מסביב לעולם. כל הקישורים במקום אחד.">
<meta property="og:title" content="Koren Olam | קורן עולם">
<meta property="og:description" content="ולוגים של טיולים, תרבויות ואתגרים מסביב לעולם.">

<link href="https://fonts.googleapis.com/css2?family=Heebo:wght@400;700&family=Rubik:wght@900&display=swap" rel="stylesheet">
<style>
  /* ===== Brand tokens (DRAFT brand kit – swap here) ===== */
  :root {
    --primary: #1FA8B8;      /* teal */
    --secondary: #F2B33D;    /* sunset gold */
    --accent: #FF5A36;       /* one-word accent */
    --bg: #F6F4EF;
    --card: #FFFFFF;
    --text: #111111;
    --muted: #5B5B5B;
    --border: rgba(17,17,17,.08);
    --font-display: "Rubik", "Heebo", system-ui, sans-serif;
    --font-body: "Heebo", system-ui, sans-serif;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #0F1415; --card: #182022; --text: #F4F4F4; --muted: #A8B0B2; --border: rgba(255,255,255,.08);
    }
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; }
  body {
    background: var(--bg);
    color: var(--text);
    font-family: var(--font-body);
    min-height: 100vh;
    display: flex; justify-content: center;
  }
  main { width: 100%; max-width: 460px; padding: 32px 16px 40px; }
  header { text-align: center; margin-bottom: 24px; }
  .avatar {
    width: 92px; height: 92px; border-radius: 50%; margin: 0 auto 12px;
    background: linear-gradient(135deg, var(--primary), var(--secondary));
    display: grid; place-items: center;
    color: #fff; font-family: var(--font-display); font-size: 40px;
    box-shadow: 0 6px 20px rgba(31,168,184,.35);
  }
  h1 { font-family: var(--font-display); font-size: 28px; margin: 0; letter-spacing: .3px; }
  .handle { color: var(--muted); font-size: 14px; direction: ltr; margin-top: 2px; }
  .bio { margin: 10px auto 0; max-width: 340px; font-size: 15px; line-height: 1.5; color: var(--muted); }

  .featured {
    display: block; text-decoration: none; color: inherit;
    background: var(--card); border: 1px solid var(--border); border-radius: 18px;
    overflow: hidden; margin-bottom: 18px;
    box-shadow: 0 8px 24px rgba(0,0,0,.08);
    transition: transform .15s ease;
  }
  .featured:active, .featured:hover { transform: translateY(-2px); }
  .featured .thumb { position: relative; aspect-ratio: 16/9; background: #222; }
  .featured img { width: 100%; height: 100%; object-fit: cover; display: block; }
  .badge {
    position: absolute; top: 10px; right: 10px;
    background: var(--accent); color: #fff; font-weight: 700; font-size: 13px;
    padding: 4px 10px; border-radius: 999px;
  }
  .play {
    position: absolute; inset: 0; margin: auto; width: 62px; height: 62px; border-radius: 50%;
    background: rgba(0,0,0,.55); display: grid; place-items: center;
  }
  .play::after { content: ""; border-style: solid; border-width: 12px 0 12px 20px; border-color: transparent transparent transparent #fff; margin-left: 5px; }
  .featured .meta { padding: 12px 14px 14px; }
  .featured .label { font-size: 13px; color: var(--primary); font-weight: 700; }
  .featured .title { font-weight: 700; font-size: 17px; line-height: 1.35; margin-top: 2px; }

  .links { display: grid; gap: 12px; }
  .link {
    display: flex; align-items: center; gap: 12px;
    text-decoration: none; color: var(--text);
    background: var(--card); border: 1px solid var(--border); border-radius: 14px;
    padding: 14px 16px; font-weight: 700; font-size: 16px;
    transition: transform .15s ease, border-color .15s ease;
  }
  .link:hover, .link:active { transform: translateY(-2px); border-color: var(--primary); }
  .link.primary { background: var(--primary); color: #fff; border-color: var(--primary); }
  .link .icon { width: 26px; height: 26px; flex: 0 0 26px; }
  .link .sub { display: block; font-weight: 400; font-size: 13px; opacity: .8; }
  .link .arrow { margin-inline-start: auto; opacity: .5; }
  footer { text-align: center; color: var(--muted); font-size: 12px; margin-top: 28px; }
</style>
</head>
<body>
<main>

      <svg class="icon" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M12 2.2c3.2 0 3.6 0 4.8.1 1.2.1 1.8.2 2.2.4.6.2 1 .5 1.4.9.4.4.7.8.9 1.4.2.4.4 1 .4 2.2.1 1.3.1 1.6.1 4.8s0 3.6-.1 4.8c-.1 1.2-.2 1.8-.4 2.2-.2.6-.5 1-.9 1.4-.4.4-.8.7-1.4.9-.4.2-1 .4-2.2.4-1.3.1-1.6.1-4.8.1s-3.6 0-4.8-.1c-1.2-.1-1.8-.2-2.2-.4-.6-.2-1-.5-1.4-.9-.4-.4-.7-.8-.9-1.4-.2-.4-.4-1-.4-2.2C2.2 15.6 2.2 15.2 2.2 12s0-3.6.1-4.8c.1-1.2.2-1.8.4-2.2.2-.6.5-1 .9-1.4.4-.4.8-.7 1.4-.9.4-.2 1-.4 2.2-.4C8.4 2.2 8.8 2.2 12 2.2zm0 4.8a5 5 0 1 0 0 10 5 5 0 0 0 0-10zm0 8.2a3.2 3.2 0 1 1 0-6.4 3.2 3.2 0 0 1 0 6.4zm5.2-9.6a1.2 1.2 0 1 0 0 2.4 1.2 1.2 0 0 0 0-2.4z"/></svg>

  <footer>© Koren Olam</footer>
</main>

<script>
  // Each bio links here with ?src=<network> (e.g. korenolam.github.io/?src=instagram).
  // YouTube links get UTM tags so the source is visible where YouTube/analytics reads them.
  (function () {
    var src = "direct";
    try {
      var p = new URLSearchParams(location.search).get("src");
      if (p && /^[a-z0-9_-]{1,20}$/i.test(p)) src = p.toLowerCase();
    } catch (e) {}
    document.querySelectorAll("a[data-yt]").forEach(function (a) {
      var u = new URL(a.href);
      u.searchParams.set("utm_source", src);
      u.searchParams.set("utm_medium", "bio");
      u.searchParams.set("utm_campaign", "linkinbio");
      a.href = u.toString();
    });
    document.querySelectorAll("a").forEach(function (a) { a.target = "_blank"; a.rel = "noopener"; });
  })();
</script>
</body>
</html>
