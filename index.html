<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Koren Olam | קורן עולם</title>
<meta name="description" content="קורן עולם – טיולים, תרבויות ואתגרים מסביב לעולם. כל הקישורים במקום אחד.">
<meta property="og:title" content="Koren Olam | קורן עולם">
<meta property="og:description" content="טיולים, תרבויות ואתגרים מסביב לעולם.">
<meta property="og:image" content="https://i.ytimg.com/vi/qRZyBhQXTDk/hqdefault.jpg">
<meta name="theme-color" content="#140F1C">
<meta name="color-scheme" content="dark">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Assistant:wght@400;600&family=Heebo:wght@700;800&family=Rubik:wght@900&display=swap" rel="stylesheet">
<style>
  /* ===== Korenolam Brand Kit (approved 2026-11-09) – change colors/fonts only here ===== */
  :root {
    --lilac: #A06CD5;        /* primary */
    --gold: #F2B33D;         /* secondary */
    --accent: #FF5A36;       /* one word only */
    --white: #FFFFFF;
    --ink: #111111;          /* outline / shadow */
    /* Dark theme (always on – Koren's choice) */
    --bg: #140F1C;
    --bg-glow: rgba(160,108,213,.22);
    --surface: #211A2B;
    --fg: #F3EEF8;
    --muted: #B3A7C2;
    --line: rgba(160,108,213,.28);
    --glass: rgba(255,255,255,.10);
    --glass-line: rgba(255,255,255,.22);
    --display: "Rubik", "Heebo", "Arial Hebrew", Arial, sans-serif;  /* Rubik Black */
    --head: "Heebo", "Arial Hebrew", Arial, sans-serif;              /* Heebo Bold */
    --body: "Assistant", "Arial Hebrew", Arial, sans-serif;          /* Assistant */
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; }
  body {
    background:
      radial-gradient(120% 60% at 50% 0%, var(--bg-glow), transparent 60%),
      radial-gradient(80% 40% at 100% 100%, rgba(242,179,61,.06), transparent 70%),
      var(--bg);
    background-attachment: fixed;
    color: var(--fg);
    font-family: var(--body); font-size: 16px; line-height: 1.5;
    min-height: 100vh; display: flex; justify-content: center;
  }
  main { width: 100%; max-width: 480px; padding: 0 0 40px; }

  /* ===== Banner (wide channel banner) ===== */
  .hero {
    position: relative; aspect-ratio: 16 / 9; overflow: hidden;
    border-radius: 0 0 24px 24px; background: #2A2135;
    box-shadow: 0 14px 40px rgba(0,0,0,.45);
  }
  .hero img { width: 100%; height: 100%; object-fit: cover; object-position: 50% 50%; display: block; }
  .hero::after {
    content: ""; position: absolute; inset: auto 0 0 0; height: 35%;
    background: linear-gradient(to top, rgba(20,15,28,.75), transparent);
  }
  @media (min-width: 481px) { main { padding-top: 20px; } .hero { border-radius: 24px; } }

  .wrap { padding: 0 16px; }

  /* ===== Floating glass bubbles ===== */
  .glass {
    background: var(--glass);
    border: 1px solid var(--glass-line);
    -webkit-backdrop-filter: blur(14px) saturate(140%);
    backdrop-filter: blur(14px) saturate(140%);
    box-shadow: 0 10px 30px rgba(0,0,0,.35), inset 0 1px 0 rgba(255,255,255,.18);
  }
  .tagline {
    position: relative; z-index: 2;
    width: fit-content; max-width: calc(100% - 32px);
    margin: -19px auto 0;
    padding: 8px 18px; border-radius: 999px;
    font-family: var(--head); font-weight: 700; font-size: clamp(13px, 3.9vw, 16px); text-align: center;
    white-space: nowrap;
    color: var(--white);
    animation: float 6s ease-in-out infinite;
  }
  .schedule {
    display: flex; align-items: center; justify-content: center; gap: 10px;
    width: fit-content; max-width: 100%;
    margin: 22px auto 14px;
    padding: 9px 18px; border-radius: 999px;
    font-family: var(--head); font-weight: 700; font-size: 15px;
    color: var(--fg);
    border-color: rgba(160,108,213,.55);
    box-shadow: 0 0 0 1px rgba(160,108,213,.15), 0 8px 26px rgba(160,108,213,.30), inset 0 1px 0 rgba(255,255,255,.18);
    animation: float 6s ease-in-out infinite; animation-delay: -3s;
  }
  .schedule .dot {
    width: 9px; height: 9px; border-radius: 50%; background: var(--accent); flex: 0 0 9px;
    box-shadow: 0 0 0 0 rgba(255,90,54,.6); animation: pulse 2s infinite;
  }
  .schedule b { color: var(--gold); font-weight: 800; }
  @keyframes float { 0%,100% { transform: translateY(0); } 50% { transform: translateY(-5px); } }
  @keyframes pulse { 0% { box-shadow: 0 0 0 0 rgba(255,90,54,.55); } 70% { box-shadow: 0 0 0 9px rgba(255,90,54,0); } 100% { box-shadow: 0 0 0 0 rgba(255,90,54,0); } }
  @media (prefers-reduced-motion: reduce) { .tagline, .schedule, .schedule .dot { animation: none; } }

  /* ===== Latest video ===== */
  .featured {
    display: block; text-decoration: none; color: inherit;
    background: var(--surface); border: 1px solid var(--line); border-radius: 18px;
    overflow: hidden; margin-bottom: 16px;
    box-shadow: 0 12px 32px rgba(0,0,0,.40);
    transition: transform .15s ease, border-color .15s ease;
  }
  .featured:hover, .featured:active { transform: translateY(-2px); border-color: var(--lilac); }
  .featured .thumb { position: relative; aspect-ratio: 16 / 9; background: #222; }
  .featured img { width: 100%; height: 100%; object-fit: cover; display: block; }
  .badge {
    position: absolute; top: 10px; right: 10px;
    background: var(--accent); color: var(--white);
    font-family: var(--head); font-weight: 800; font-size: 13px;
    padding: 3px 11px; border-radius: 999px;
  }
  .play {
    position: absolute; inset: 0; margin: auto; width: 62px; height: 62px; border-radius: 50%;
    background: rgba(17,17,17,.55); display: grid; place-items: center;
  }
  .play::after { content: ""; border-style: solid; border-width: 12px 0 12px 20px; border-color: transparent transparent transparent var(--white); margin-left: 5px; }
  .featured .meta { padding: 12px 14px 14px; }
  .featured .label { font-family: var(--head); font-weight: 700; font-size: 13px; color: var(--lilac); }
  .featured .title { font-family: var(--head); font-weight: 700; font-size: 17px; line-height: 1.35; margin-top: 2px; }

  /* ===== Links ===== */
  .links { display: grid; gap: 12px; }
  .link {
    display: flex; align-items: center; gap: 12px;
    text-decoration: none; color: var(--fg);
    background: var(--surface); border: 1px solid var(--line); border-radius: 14px;
    padding: 14px 16px; font-family: var(--head); font-weight: 700; font-size: 16px;
    transition: transform .15s ease, border-color .15s ease;
  }
  .link:hover, .link:active { transform: translateY(-2px); border-color: var(--lilac); }
  .link.primary { background: var(--lilac); color: var(--white); border-color: var(--lilac); box-shadow: 0 8px 24px rgba(160,108,213,.40); }
  .link.primary .sub { color: var(--white); opacity: .85; }
  .link .icon { width: 26px; height: 26px; flex: 0 0 26px; }
  .link .sub { display: block; font-family: var(--body); font-weight: 400; font-size: 13px; color: var(--muted); }
  .link .arrow { margin-inline-start: auto; opacity: .5; font-size: 20px; }
  footer { text-align: center; color: var(--muted); font-size: 12px; margin-top: 28px; letter-spacing: .04em; }
  footer span { color: var(--gold); }
</style>
</head>
<body>
<main>
  <div class="hero">
    <img src="banner.jpg" width="960" height="540" alt="קורן עולם – Koren Olam, Explore the World">
  </div>

  <div class="wrap">
    <div class="tagline glass">טיולים, תרבויות ואתגרים מסביב לעולם 🌍</div>

    <div class="schedule glass"><span class="dot" aria-hidden="true"></span><span>פרק חדש ביוטיוב כל חמישי ב-<b>18:00</b></span></div>

    <!-- ===== Latest long video: update VIDEO_ID + title on every new upload ===== -->
    <a class="featured" data-yt href="https://www.youtube.com/watch?v=qRZyBhQXTDk">
      <div class="thumb">
        <img src="https://i.ytimg.com/vi/qRZyBhQXTDk/hqdefault.jpg" alt="תמונה מהפרק האחרון">
        <span class="badge">חדש</span>
        <span class="play" aria-hidden="true"></span>
      </div>
      <div class="meta">

        <div class="title">24 שעות: זרים מחליטים עליי הכל בתאילנד 🇹🇭</div>
      </div>
    </a>

    <nav class="links">
      <a class="link primary" data-yt href="https://www.youtube.com/channel/UCmmgrJ-m0qlGdMzETUl1pbw?sub_confirmation=1">
        <svg class="icon" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M23.5 6.2a3 3 0 0 0-2.1-2.1C19.5 3.6 12 3.6 12 3.6s-7.5 0-9.4.5A3 3 0 0 0 .5 6.2 31 31 0 0 0 0 12a31 31 0 0 0 .5 5.8 3 3 0 0 0 2.1 2.1c1.9.5 9.4.5 9.4.5s7.5 0 9.4-.5a3 3 0 0 0 2.1-2.1A31 31 0 0 0 24 12a31 31 0 0 0-.5-5.8zM9.6 15.6V8.4l6.3 3.6-6.3 3.6z"/></svg>
        <span>הירשמו לערוץ ביוטיוב<span class="sub">כל הפרקים המלאים</span></span>
        <span class="arrow">‹</span>
      </a>
      <a class="link" href="https://www.instagram.com/korenolam/">
        <svg class="icon" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M12 2.2c3.2 0 3.6 0 4.8.1 1.2.1 1.8.2 2.2.4.6.2 1 .5 1.4.9.4.4.7.8.9 1.4.2.4.4 1 .4 2.2.1 1.3.1 1.6.1 4.8s0 3.6-.1 4.8c-.1 1.2-.2 1.8-.4 2.2-.2.6-.5 1-.9 1.4-.4.4-.8.7-1.4.9-.4.2-1 .4-2.2.4-1.3.1-1.6.1-4.8.1s-3.6 0-4.8-.1c-1.2-.1-1.8-.2-2.2-.4-.6-.2-1-.5-1.4-.9-.4-.4-.7-.8-.9-1.4-.2-.4-.4-1-.4-2.2C2.2 15.6 2.2 15.2 2.2 12s0-3.6.1-4.8c.1-1.2.2-1.8.4-2.2.2-.6.5-1 .9-1.4.4-.4.8-.7 1.4-.9.4-.2 1-.4 2.2-.4C8.4 2.2 8.8 2.2 12 2.2zm0 4.8a5 5 0 1 0 0 10 5 5 0 0 0 0-10zm0 8.2a3.2 3.2 0 1 1 0-6.4 3.2 3.2 0 0 1 0 6.4zm5.2-9.6a1.2 1.2 0 1 0 0 2.4 1.2 1.2 0 0 0 0-2.4z"/></svg>
        <span>Instagram<span class="sub">רגעים מהדרך</span></span>
        <span class="arrow">‹</span>
      </a>
      <a class="link" href="https://www.tiktok.com/@korenolam">
        <svg class="icon" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M16.6 2h-3.4v13.4a2.9 2.9 0 1 1-2-2.8V9.1a6.3 6.3 0 1 0 5.4 6.3V8.6a7.6 7.6 0 0 0 4.4 1.4V6.6a4.3 4.3 0 0 1-4.4-4.6z"/></svg>

      <a class="link" href="https://www.facebook.com/1200901773117476">
        <svg class="icon" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M24 12a12 12 0 1 0-13.9 11.9v-8.4H7.1V12h3V9.4c0-3 1.8-4.7 4.5-4.7 1.3 0 2.7.2 2.7.2v3h-1.5c-1.5 0-2 .9-2 1.9V12h3.4l-.5 3.5h-2.9v8.4A12 12 0 0 0 24 12z"/></svg>
        <span>Facebook</span>
        <span class="arrow">‹</span>
      </a>
    </nav>

    <footer>Koren Olam <span>•</span> Explore the World</footer>
  </div>
</main>

<script>
  // Each bio links here with ?src=<network> (e.g. korenolam.github.io/?src=instagram).
  // YouTube links get UTM tags so the traffic source is marked.
  (function () {
    var src = "direct";
    try {
      var p = new URLSearchParams(location.search).get("src");
      if (p && /^[a-z0-9_-]{1,20}$/i.test(p)) src = p.toLowerCase();
    } catch (e) {}
    document.querySelectorAll("a[data-yt]").forEach(function (a) {
      var u = new URL(a.href);
      u.searchParams.set("utm_source", src);
      u.searchParams.set("utm_medium", "bio");
      u.searchParams.set("utm_campaign", "linkinbio");
      a.href = u.toString();
    });
    document.querySelectorAll("a").forEach(function (a) { a.target = "_blank"; a.rel = "noopener"; });
  })();
</script>
</body>
</html>
